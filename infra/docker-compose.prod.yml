name: personal-ai-knowledge-site-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-prod-env-file: &prod-env-file
  - path: ./env/production.env
    required: false

x-node-build-args: &node-build-args
  NODE_IMAGE: node:22-alpine
  PNPM_VERSION: 11.7.0

services:
  postgres:
    image: postgres:16-alpine
    container_name: cks-prod-postgres
    env_file: *prod-env-file
    # 2GB 服务器优化：限制 PostgreSQL 内存占用到 100-150MB
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-content} -d $${POSTGRES_DB:-content_platform}"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  cms:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
      args: *node-build-args
    container_name: cks-prod-cms
    env_file: *prod-env-file
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/access"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    logging: *default-logging

  cms-init:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
      target: init
      args: *node-build-args
    container_name: cks-prod-cms-init
    profiles:
      - init
    env_file: *prod-env-file
    environment:
      # Payload only applies db.push during initialization outside production.
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=512
      PAYLOAD_FORCE_DRIZZLE_PUSH: "true"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  web-build:
    build:
      context: ..
      dockerfile: Dockerfile.web-build
      args: *node-build-args
    container_name: cks-prod-web-build
    profiles:
      - build
    working_dir: /app/apps/web
    env_file: *prod-env-file
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      CMS_API_URL: http://cms:3000/api
    depends_on:
      cms:
        condition: service_healthy
    volumes:
      - web_dist:/app/apps/web/dist
    command: ["pnpm", "build"]
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web-runtime
      args: *node-build-args
    image: personal-ai-knowledge-site-web:latest
    container_name: cks-prod-web
    env_file: *prod-env-file
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      NODE_OPTIONS: --max-old-space-size=256
      CMS_API_URL: http://cms:3000/api
    volumes:
      - web_dist:/app/apps/web/dist:ro
    ports:
      - "8080:4321"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging: *default-logging

volumes:
  postgres_data:
  web_dist:
