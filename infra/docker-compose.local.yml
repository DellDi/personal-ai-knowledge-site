name: personal-ai-knowledge-site-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: cks-local-postgres
    environment:
      POSTGRES_DB: content_platform
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content_platform"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cks-local-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: cks-local-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio_admin minio_admin_password &&
      mc mb local/content-platform --ignore-existing &&
      mc anonymous set download local/content-platform &&
      echo 'Bucket content-platform created.'
      "
    restart: "no"

  cms-init:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
      target: init
    container_name: cks-local-cms-init
    environment:
      NODE_ENV: development
      DATABASE_URI: postgres://content:content_password@postgres:5432/content_platform
      PAYLOAD_SECRET: payload_secret_change_me
      PAYLOAD_ENABLE_AUTOLOGIN: "true"
      PAYLOAD_PUBLIC_SELF_PATH: http://localhost:${CMS_HOST_PORT:-3000}
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:${CMS_HOST_PORT:-3000}
      PAYLOAD_CORS_ORIGINS: "http://localhost:4321,http://localhost:${CMS_HOST_PORT:-3000}"
      PAYLOAD_CSRF_ORIGINS: "http://localhost:4321,http://localhost:${CMS_HOST_PORT:-3000}"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: content-platform
      S3_ACCESS_KEY_ID: minio_admin
      S3_SECRET_ACCESS_KEY: minio_admin_password
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  cms:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
    container_name: cks-local-cms
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://content:content_password@postgres:5432/content_platform
      PAYLOAD_SECRET: payload_secret_change_me
      PAYLOAD_ENABLE_AUTOLOGIN: "true"
      PAYLOAD_PUBLIC_SELF_PATH: http://localhost:${CMS_HOST_PORT:-3000}
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:${CMS_HOST_PORT:-3000}
      PAYLOAD_CORS_ORIGINS: "http://localhost:4321,http://localhost:${CMS_HOST_PORT:-3000}"
      PAYLOAD_CSRF_ORIGINS: "http://localhost:4321,http://localhost:${CMS_HOST_PORT:-3000}"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: content-platform
      S3_ACCESS_KEY_ID: minio_admin
      S3_SECRET_ACCESS_KEY: minio_admin_password
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      cms-init:
        condition: service_completed_successfully
    ports:
      - "${CMS_HOST_PORT:-3000}:3000"

volumes:
  postgres_data:
  minio_data:
